[GlobalDefaults DeviceProfile]
; Planet surfaces, clouds, relief and night maps (Tools/Prepare-PlanetMaterials.py) use Project01.
; Linear mip filtering removes visible mip bands across the large projected planet discs; the
; 16K limit admits the real Earth base maps. The engine World group and ship textures are unchanged.
+TextureLODGroups=(Group=TEXTUREGROUP_Project01,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
