<div id="daedalus-hud-concept" aria-label="Minimalistický HUD Daedala">
<style>
#daedalus-hud-concept{--radar:#a9d4b0;--shield:#87b8d9;--text:#d7e0e6;--muted:#9aaab5;--amber:#d4b470;--turret:#cf9a78;--beam:#92cbe5;color:var(--text);font-family:'Segoe UI',Arial,sans-serif}
#daedalus-hud-concept *{box-sizing:border-box}
#daedalus-hud-concept .stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#020405;isolation:isolate;font-size:13px}
#daedalus-hud-concept .scene{position:absolute;top:0;left:0;width:100%;height:124%;object-fit:cover;object-position:48% top}
#daedalus-hud-concept .stars{position:absolute;inset:0;width:100%;height:100%;color:#c0ccd5;opacity:.4}
#daedalus-hud-concept .location{position:absolute;top:4%;left:3%;width:205px;text-shadow:0 1px 3px #000}
#daedalus-hud-concept .system-name{font-weight:500;letter-spacing:.06em}
#daedalus-hud-concept .sub{color:var(--muted);margin-top:6px}
#daedalus-hud-concept .radar{color:var(--radar);width:170px;height:170px;display:block;margin:13px 0 0;overflow:visible}
#daedalus-hud-concept .radar .grid{fill:none;stroke:currentColor;opacity:.45;stroke-width:1}
#daedalus-hud-concept .radar text{fill:currentColor;font-size:11px;font-family:inherit}
#daedalus-hud-concept .computer{position:absolute;top:4%;right:3%;width:265px;background:linear-gradient(90deg,transparent,rgba(5,12,18,.55));padding:0 0 10px 16px}
#daedalus-hud-concept .computer-header{border-bottom:1px solid #587080;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;letter-spacing:.07em}
#daedalus-hud-concept .serial{color:var(--muted);font-size:11px}
#daedalus-hud-concept .computer button{display:flex;width:100%;justify-content:space-between;background:transparent;border:0;color:var(--muted);font:inherit;text-align:left;padding:10px 6px}
#daedalus-hud-concept .computer button:hover,#daedalus-hud-concept .computer button[aria-pressed="true"]{color:var(--text);background:rgba(115,167,197,.10)}
#daedalus-hud-concept .computer button[aria-pressed="true"] span:last-child{color:var(--shield)}
#daedalus-hud-concept .content{padding:10px 6px 0;color:var(--muted);font-size:12px;min-height:44px}
#daedalus-hud-concept .dock{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:16px;width:max-content;max-width:95%;text-shadow:0 1px 3px #000}
#daedalus-hud-concept .ship-block{width:175px;text-align:center}
#daedalus-hud-concept .vessel{width:175px;height:175px;display:block;margin:auto}
#daedalus-hud-concept .shield{fill:none;stroke:var(--shield);stroke-width:4;opacity:.55}
#daedalus-hud-concept .hull{fill:rgba(98,122,136,.12);stroke:#bdcbd4;stroke-width:2}
#daedalus-hud-concept .zone{display:none}
#daedalus-hud-concept .zone.is-selected{display:inline}
#daedalus-hud-concept .zone[data-weapon="turret"]{fill:var(--turret)}
#daedalus-hud-concept .zone[data-weapon="missile"]{fill:var(--amber)}
#daedalus-hud-concept .zone[data-weapon="beam"]{fill:var(--beam)}
#daedalus-hud-concept .ship-name{letter-spacing:.15em;margin-top:4px;font-size:12px}
#daedalus-hud-concept .energy{display:flex;justify-content:center;gap:9px;margin-top:9px;font-size:10px;color:var(--muted)}
#daedalus-hud-concept .energy span{white-space:nowrap}
#daedalus-hud-concept .drive{display:flex;align-items:flex-end;gap:10px;padding-bottom:34px}
#daedalus-hud-concept .thrust{display:flex;align-items:flex-end;gap:5px}
#daedalus-hud-concept .meter{position:relative;width:6px;height:130px;background:rgba(126,143,156,.23)}
#daedalus-hud-concept .meter::after{content:'';position:absolute;bottom:0;width:100%;height:var(--thrust-fill,0%);background:var(--amber)}
#daedalus-hud-concept .meter-scale{height:130px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--muted)}
#daedalus-hud-concept .drive-readings{min-width:98px}
#daedalus-hud-concept .speed{font-size:25px;font-variant-numeric:tabular-nums}
#daedalus-hud-concept .speed small{font-size:12px;color:var(--muted)}
#daedalus-hud-concept .throttle-readout{color:var(--amber);margin-top:8px;font-variant-numeric:tabular-nums}
#daedalus-hud-concept .mode{margin-top:9px;color:var(--muted);font-size:11px;letter-spacing:.10em}
#daedalus-hud-concept .weapons{padding-bottom:34px;min-width:255px}
#daedalus-hud-concept .weapon-heading{color:var(--muted);display:flex;justify-content:space-between;gap:20px;margin-bottom:11px;font-size:11px;letter-spacing:.08em}
#daedalus-hud-concept .weapon-options{display:flex;gap:8px}
#daedalus-hud-concept .weapon{--weapon-color:var(--turret);position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;color:var(--text);background:rgba(7,14,20,.48);width:79px;height:83px;padding:10px 9px;border:1px solid rgba(138,164,180,.22);font:inherit;font-size:11px}
#daedalus-hud-concept .weapon::before{content:'';position:absolute;top:0;left:9px;right:9px;height:2px;background:var(--weapon-color);opacity:.6}
#daedalus-hud-concept .weapon[data-weapon="missile"]{--weapon-color:var(--amber)}
#daedalus-hud-concept .weapon[data-weapon="beam"]{--weapon-color:var(--beam)}
#daedalus-hud-concept .category{color:var(--weapon-color);letter-spacing:.08em}
#daedalus-hud-concept .status{color:var(--muted);font-size:10px}
#daedalus-hud-concept .weapon[aria-pressed="true"]{border-color:var(--weapon-color);background:rgba(26,43,56,.52)}
#daedalus-hud-concept .weapon:hover{background:rgba(38,54,65,.6)}
#daedalus-hud-concept .zone-summary{color:var(--muted);margin-top:8px;font-size:10px;min-height:15px}
@media(min-width:1600px){
 #daedalus-hud-concept .stage{font-size:.65vw}
 #daedalus-hud-concept .location{width:10vw}
 #daedalus-hud-concept .sub{margin-top:.3vw}
 #daedalus-hud-concept .radar{width:8.2vw;height:8.2vw;margin-top:.7vw}
 #daedalus-hud-concept .computer{width:12.8vw;padding-left:.8vw}
 #daedalus-hud-concept .computer-header{padding-bottom:.5vw}
 #daedalus-hud-concept .serial{font-size:.55vw}
 #daedalus-hud-concept .computer button{padding:.55vw .3vw}
 #daedalus-hud-concept .content{padding:.6vw .3vw 0;min-height:2.4vw;font-size:.6vw}
 #daedalus-hud-concept .dock{gap:.8vw}
 #daedalus-hud-concept .ship-block,#daedalus-hud-concept .vessel{width:8.2vw}
 #daedalus-hud-concept .vessel{height:8.2vw}
 #daedalus-hud-concept .ship-name{font-size:.6vw;margin-top:.2vw}
 #daedalus-hud-concept .energy{gap:.5vw;margin-top:.5vw;font-size:.52vw}
 #daedalus-hud-concept .drive{gap:.5vw;padding-bottom:1.5vw}
 #daedalus-hud-concept .meter{width:.28vw;height:6.1vw}
 #daedalus-hud-concept .meter-scale{height:6.1vw;font-size:.52vw}
 #daedalus-hud-concept .drive-readings{min-width:5.2vw}
 #daedalus-hud-concept .speed{font-size:1.2vw}
 #daedalus-hud-concept .speed small{font-size:.6vw}
 #daedalus-hud-concept .throttle-readout{margin-top:.4vw}
 #daedalus-hud-concept .mode{margin-top:.5vw;font-size:.55vw}
 #daedalus-hud-concept .weapons{min-width:12.8vw;padding-bottom:1.5vw}
 #daedalus-hud-concept .weapon-heading{font-size:.55vw;margin-bottom:.5vw}
 #daedalus-hud-concept .weapon-options{gap:.4vw}
 #daedalus-hud-concept .weapon{width:4vw;height:4.4vw;padding:.6vw .5vw;font-size:.58vw}
 #daedalus-hud-concept .status{font-size:.52vw}
 #daedalus-hud-concept .zone-summary{font-size:.52vw;margin-top:.45vw}
}
@media(max-width:700px){
 #daedalus-hud-concept .stage{aspect-ratio:auto;min-height:900px}
 #daedalus-hud-concept .location{width:44%;left:3%;top:20px}
 #daedalus-hud-concept .radar{width:100%;max-width:150px}
 #daedalus-hud-concept .computer{width:46%;right:3%;top:20px;padding-left:6px}
 #daedalus-hud-concept .computer-header{flex-wrap:wrap;gap:6px}
 #daedalus-hud-concept .dock{width:95%;max-width:95%;flex-wrap:wrap;justify-content:center;gap:14px}
 #daedalus-hud-concept .weapons{width:100%;padding-bottom:0}
 #daedalus-hud-concept .weapon-options{justify-content:center}
 #daedalus-hud-concept .weapon-heading,#daedalus-hud-concept .zone-summary{text-align:center;justify-content:center}
}
</style>
<div class="stage">
 <svg class="stars" viewBox="0 0 1600 900" aria-hidden="true"><g fill="currentColor">__STARS__</g></svg>
 __BACKGROUND__
 <section class="location" aria-label="Poloha a volná holografická minimapa">
  <div class="system-name">SLUNEČNÍ SOUSTAVA</div><div class="sub">Země · oběžná dráha</div>
  <svg class="radar" viewBox="0 0 190 190" role="img" aria-label="Minimapa bez panelu, tři kruhy, příď lodi, Země a Měsíc">
   <g class="grid"><circle cx="95" cy="95" r="87"/><circle cx="95" cy="95" r="58"/><circle cx="95" cy="95" r="29"/><path d="M8 95H182M95 8V182"/></g>
   <path d="M95 86L90 100L95 97L100 100Z" fill="currentColor"/>
   <circle cx="53" cy="121" r="3" fill="currentColor"/><text x="18" y="144">Země</text>
   <circle cx="132" cy="50" r="2" fill="currentColor"/><text x="130" y="37">Měsíc</text>
  </svg>
 </section>
 <section class="computer" aria-label="Palubní počítač">
  <div class="computer-header"><span>PALUBNÍ POČÍTAČ</span><span class="serial">BC–304</span></div>
  <button class="cursor-interaction" type="button" data-page="navigace" aria-pressed="true"><span>Navigace</span><span>↗</span></button>
  <button class="cursor-interaction" type="button" data-page="skenovani" aria-pressed="false"><span>Skenování</span><span>+</span></button>
  <button class="cursor-interaction" type="button" data-page="lod" aria-pressed="false"><span>Informace o lodi</span><span>›</span></button>
  <button class="cursor-interaction" type="button" data-page="hyperpohon" aria-pressed="false"><span>Hyperpohon</span><span>»</span></button>
  <div class="content" aria-live="polite">Databáze soustav a těles</div>
 </section>
 <div class="dock">
  <section class="ship-block" aria-label="Daedalus, štíty a vedlejší údaje energie">
   <svg class="vessel" viewBox="0 0 240 240" role="img" aria-label="Skutečný obrys Daedala, čtyři modré sektory štítů a volitelně zvýrazněné zbraňové zóny">
    <g class="shield"><path d="M46 48 A103 103 0 0 1 194 48"/><path d="M199 53 A103 103 0 0 1 199 187"/><path d="M194 192 A103 103 0 0 1 46 192"/><path d="M41 187 A103 103 0 0 1 41 53"/></g>
    <g transform="__HULL_TRANSFORM__"><path class="hull" d="__HULL_PATH__"/>__WEAPON_ZONES__</g>
   </svg>
   <div class="ship-name">DAEDALUS</div><div class="energy" aria-label="Energie zatím nezapojená"><span>ZBR —</span><span>ŠTÍ —</span><span>MOT —</span><span>SYS —</span></div>
  </section>
  <section class="drive" aria-label="Rychlost a nastavený tah motoru">
   <div class="thrust"><div class="meter" role="meter" aria-label="Tah motoru" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div><div class="meter-scale"><span>100</span><span>0</span></div></div>
   <div class="drive-readings"><div class="speed">0 <small>km/s</small></div><div class="throttle-readout">TAH 0 %</div><div class="mode">IMPULS</div></div>
  </section>
  <section class="weapons" aria-label="Tři skupiny výzbroje Daedala">
   <div class="weapon-heading"><span>VÝZBROJ</span><span>NEZAPOJENO</span></div>
   <div class="weapon-options">
    <button class="weapon cursor-interaction" type="button" data-weapon="turret" aria-pressed="false" aria-label="Ukázat skutečné pozice dělových věží"><span class="category">VĚŽE</span><span>Railguny</span><span class="status">—</span></button>
    <button class="weapon cursor-interaction" type="button" data-weapon="missile" aria-pressed="false" aria-label="Ukázat skutečné pozice raketových sil"><span class="category">RAKETY</span><span>Příďová sila</span><span class="status">—</span></button>
    <button class="weapon cursor-interaction" type="button" data-weapon="beam" aria-pressed="false" aria-label="Ukázat skutečné pozice paprskových emitorů"><span class="category">PAPRSKY</span><span>Asgardské</span><span class="status">—</span></button>
   </div><div class="zone-summary" aria-live="polite"></div>
  </section>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('daedalus-hud-concept');
 const pages={navigace:'Databáze soustav a těles',skenovani:'Připraveno pro budoucí skenování',lod:'Daedalus · BC–304',hyperpohon:'Připraveno pro budoucí hyperpohon'};
 root.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));root.querySelector('.content').textContent=pages[button.dataset.page];}));
 const names={turret:'Dělové věže',missile:'Raketová sila',beam:'Paprskové emitory'};
 root.querySelectorAll('button[data-weapon]').forEach(button=>button.addEventListener('click',()=>{
  const selected=button.getAttribute('aria-pressed')!=='true';
  root.querySelectorAll('button[data-weapon]').forEach(b=>b.setAttribute('aria-pressed',String(selected&&b===button)));
  root.querySelectorAll('.zone').forEach(dot=>dot.classList.toggle('is-selected',selected&&dot.dataset.weapon===button.dataset.weapon));
  root.querySelector('.zone-summary').textContent=selected?names[button.dataset.weapon]+' · umístění na modelu':'';
 }));
 const appearance={radar:'#a9d4b0',shields:'#87b8d9'};
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--radar',appearance.radar);root.style.setProperty('--shield',appearance.shields);}});tweak.addColorPicker(appearance,'radar',{label:'Odstín minimapy',reference:'--radar'});tweak.addColorPicker(appearance,'shields',{label:'Odstín štítů',reference:'--shield'});}
})();
</script>
</div>
